name: Publish

on:
  push:
    branches: [main]
    paths:
      - Containerfile
      - cpak.json
      - pnpm-wrapper
      - node-wrapper
      - .github/workflows/docker-publish.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: publish-pnpm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ghcr.io/containerpak/pnpm
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Containerfile
          pull: true
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Verify package
        run: |
          for platform in linux/amd64 linux/arm64; do
            docker run --rm --platform "$platform" ghcr.io/containerpak/pnpm:main pnpm --version
            docker run --rm --platform "$platform" ghcr.io/containerpak/pnpm:main node --version
          done
          docker run --rm --platform linux/amd64 -e HOME=/tmp/pnpm-home ghcr.io/containerpak/pnpm:main sh -c '
            mkdir -p "$HOME"
            test "$(node --version)" = v24.19.0
            pnpm runtime set node 22.23.2 -g
            test "$(node --version)" = v22.23.2
          '
